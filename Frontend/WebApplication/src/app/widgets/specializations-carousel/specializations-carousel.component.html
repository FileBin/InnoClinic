<app-loading [loaded]="loaded" [diameter]="100">
	<ngb-carousel
    [interval]="3000"
	[pauseOnHover]="true"
	[pauseOnFocus]="true">
        @for (item of data; track item) {
            <ng-template ngbSlide>
                <div class="slide">
                </div>
                <div class="carousel-caption">
                    <h3>{{item.name}}</h3>
                </div>
            </ng-template>
        }
	</ngb-carousel>
</app-loading>
